[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = true
sort_reverse = false
sort_dir_first = true
linemode = "none"
show_hidden = true
show_symlink = true

[tasks]
image_alloc = 1073741824 # = 1024*1024*1024 = 1024MB
suppress_preload = true

[preview]
cache_dir = "~/.cache/yazi"

[opener]
custom = [
  # { run = "gio open %s1", desc = "gio-open", for = "linux", orphan = true },
  { run = "xdg-open %s", desc = "xdg-open", for = "linux", orphan = true },
  { run = "chezmoi add %s", desc = "chezmoi add", for = "linux" },
  { run = "nautilus --select %s", desc = "nautilus", for = "linux", orphan = true },
]

[[opener.bulk-rename]]
run   = "$EDITOR %s"
block = true

[[open.prepend_rules]]
url = "bulk-rename.txt"
use = "bulk-rename"

[open]
rules = [
	{ url = "*/", use = "custom" },
	{ url = "*", use = "custom" },
]
