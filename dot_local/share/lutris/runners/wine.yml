system:
  disable_runtime: false
  env:
    DRI_PRIME: '1'
    UMU_RUNTIME_UPDATE: '0'
  mangohud: true
  postexit_command: /usr/bin/dms ipc inhibit disable
  prelaunch_command: /usr/bin/dms ipc inhibit enable
  terminal_app: /usr/bin/alacritty
wine:
  system_winetricks: true
  version: Proton - Experimental
