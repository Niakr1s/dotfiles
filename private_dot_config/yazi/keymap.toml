[[mgr.prepend_keymap]]
on = [ "q" ]
run = "quit --no-cwd-file"
desc = "Quit Yazi without changing directory"

[[mgr.prepend_keymap]]
on = [ "Q" ]
run = "quit"
desc = "Quit Yazi and change directory in shell"

[[mgr.prepend_keymap]]
on = "i"
run = 'shell "nvim $@" --block'
desc = "Open in Neovim"

[[mgr.prepend_keymap]]
on = "I"
run = 'shell "sudo nvim $@" --block'
desc = "Open in Neovim with sudo"
