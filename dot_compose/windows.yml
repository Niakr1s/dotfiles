services:
  windows:
    image: dockurr/windows
    container_name: windows

    environment:
      VERSION: "core11"

      USERNAME: "bill"
      PASSWORD: "gates"

      RAM_SIZE: "8G"
      CPU_CORES: "6"

    devices:
      - /dev/kvm
      - /dev/net/tun

    # cap_add:
    #   - NET_ADMIN

    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp

    volumes:
      - /data/hdd1/Install/Windows/core11.iso:/custom.iso:Z
      - /data/hdd1/VMs/windows:/storage:Z
      - /data:/shared:Z
